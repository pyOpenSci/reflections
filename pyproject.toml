[project]
name = "reflections"
version = "0.1.0"
description = "A pyOpenSci project for reflecting on package status (PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "packaging>=26.3",
    "pandas>=3.1.1",
    "pygithub>=2.10.0",
]

[project.optional-dependencies]
analysis = [
    "cmcrameri>=1.9",
    "matplotlib>=3.11.2",
]

[project.scripts]
reflections = "reflections:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
