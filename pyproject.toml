[project]
name = "reflections"
version = "0.1.0"
description = "A pyOpenSci project for reflecting on package status (PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pygithub>=2.10.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
reflections = "reflections:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.2",
]
